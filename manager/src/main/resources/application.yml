server:
  port: ${MANAGER_PORT:8081}
  servlet:
    session:
      timeout: 480m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: lingqu-manager
  flyway:
    enabled: true
    # {vendor} 由 Spring Boot 根据数据库类型自动替换为 mysql / postgresql
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.lingqu: info

app:
  # AES 加密密钥（16 字节），生产环境务必通过环境变量 AES_KEY 覆盖
  aes-key: ${AES_KEY:lingqu-aes-key-01}
  default-admin-user: ${DEFAULT_ADMIN_USER:admin}
  default-admin-pass: ${DEFAULT_ADMIN_PASS:123456}
