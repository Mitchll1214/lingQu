# 灵渠数据接口平台 - 本地一键联调（MySQL 配置库 + 单容器）
version: "3.8"

services:
  config-db:
    image: mysql:5.7
    container_name: lingqu-config-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: lingqu
      MYSQL_USER: lingqu
      MYSQL_PASSWORD: lingqu123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  lingqu:
    build: .
    container_name: lingqu
    depends_on:
      config-db:
        condition: service_healthy
    environment:
      # 配置库（必需）
      DB_TYPE: mysql
      DB_HOST: config-db
      DB_PORT: "3306"
      DB_NAME: lingqu
      DB_USER: lingqu
      DB_PASSWORD: lingqu123
      # 可选
      # DEFAULT_ADMIN_USER: admin
      # DEFAULT_ADMIN_PASS: "123456"
      # AES_KEY: lingqu-aes-key-01        # 生产必改，Manager/Executor 保持一致
      # MANAGER_PORT: "8081"
      # EXECUTOR_PORT: "8080"
      # 告警邮件（可选，不配置则跳过发送）
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: "465"
      # SMTP_USERNAME: alert@example.com
      # SMTP_PASSWORD: yourpassword
      # ALERT_MAIL_FROM: alert@example.com
      # ALERT_MAIL_TO: ops@example.com
    ports:
      - "8080:8080"   # 业务 API
      - "8081:8081"   # 管理后台

volumes:
  dbdata:
